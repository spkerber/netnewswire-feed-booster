[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netnewswire-feed-booster"
version = "0.3.1"
description = "Local-first RSS source manager for NetNewsWire OPML workflows."
license = {text = "MIT"}
requires-python = ">=3.9"
# The tool runs on the standard library alone. Keep this empty; the hosted
# bridge's packages belong in the modal extra below.
dependencies = []

[project.optional-dependencies]
modal = [
  "fastapi[standard]>=0.115.8",
  "modal>=1.5.3",
]

[project.scripts]
netnewswire-feed-booster = "netnewswire_feed_booster.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
