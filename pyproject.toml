[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netnewswire-feed-booster"
version = "0.1.0"
description = "Local-first RSS source manager for NetNewsWire OPML workflows."
license = {text = "MIT"}
requires-python = ">=3.9"

[project.optional-dependencies]
modal = [
  "fastapi[standard]",
  "modal",
]

[project.scripts]
netnewswire-feed-booster = "netnewswire_feed_booster.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
